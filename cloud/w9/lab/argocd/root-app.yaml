apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: w9-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nguyenha0112/lab-Argo-CD-w9.git
    targetRevision: main
    path: cloud/w9/lab/argocd
    directory:
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
