apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web
  namespace: mini-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: web-error-rate
        - setWeight: 50
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: web-error-rate
